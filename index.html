<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>This video</title>
</head>

<body>
  <div class="wrapper-page">
    <div class="content">
      <video loop autoplay muted class="video" src="./assets/video/video.mp4"></video>
      <div class="container-text">
        <div class="container-text__line-1">
          <span class="content-text">We're here</span>
          <span class="content-transparent"></span>
          <span class="content-text">to make</span>
        </div>
        <div class="container-text__line-2">
          <span class="content-text">healthy</span>
          <span class="content-transparent"></span>
          <span class="content-text">living effortless</span>
        </div>
        <div class="container-text__line-3">
          <span class="content-text">so you can</span>
          <span class="content-transparent"></span>
          <span class="content-text">life longer</span>
        </div>
        <div class="container-text__line-4">
          <span class="content-text">and happier</span>
          <span class="content-transparent"></span>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
